# CocoX.wtf Browser — Render Static Site
# Connect this repository to Render and use this Blueprint.
services:
  - type: web
    name: cocox-wtf-browser
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && PORT=10000 BASE_PATH=/ pnpm --filter @workspace/cocox-home build
    staticPublishPath: ./artifacts/cocox-home/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
