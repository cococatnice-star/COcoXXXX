# CocoX.wtf Browser — Render Node Web Service (Ultraviolet)
services:
  - type: web
    name: cocox-wtf-browser-uv
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/cocox-home build && pnpm --filter @workspace/api-server build
    startCommand: pnpm --filter @workspace/api-server start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
